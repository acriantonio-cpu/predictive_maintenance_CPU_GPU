# HWDrift — configurazione di esempio.
# Copiare in hwdrift.yaml (cartella corrente) oppure nella cartella dati
# (%LOCALAPPDATA%\HWDrift su Windows). Ogni chiave omessa usa il default.
# Le chiavi sconosciute producono un errore esplicito.

language: it             # en | it: interfaccia, report, allarmi, ipotesi, notifiche

sampling:
  interval_s: 1.0          # 0.5–5 s
  flush_s: 60              # scrittura in batch
  raw_retention_h: 48      # il grezzo a 1 Hz si tiene 48 ore; gli aggregati per sempre
  adaptive: true           # allunga l'intervallo se l'overhead supera il budget
  cpu_budget_pct: 1.0      # % di un core
  rss_budget_mb: 100

sources:
  simulator:
    enabled: false         # true = nessun hardware, dati sintetici (sviluppo)
    scenario: healthy      # healthy | throttle | frozen | crash | power_limit
  lhm:
    enabled: true
    mode: web              # web: server web di LibreHardwareMonitor (Options > Remote Web Server)
    url: http://127.0.0.1:8085/data.json   # solo loopback
    # mode: dll
    # dll_path: C:\Tools\LibreHardwareMonitor\LibreHardwareMonitorLib.dll
  nvml:
    enabled: true          # GPU NVIDIA (opzionale)
  eventlog:
    enabled: true          # WHEA, TDR, Kernel-Power, BugCheck
  perfcounters:
    enabled: true          # clock effettivo della CPU
  psutil:
    enabled: true
  sysinfo:
    enabled: true          # versioni di driver e BIOS -> eventi di configurazione
  smart:
    enabled: false
    devices: []            # es. ["/dev/sda"] o ["\\\\.\\PhysicalDrive0"]

profile:
  auto_mapping: true
  mapping: {}              # incollare qui l'output di: hwdrift discover --write-profile p.yaml
  reference:
    mode: channel          # channel | user | none
    channel: ssd0.temp_c   # proxy interno dell'ambiente (si contamina se l'airflow peggiora)
    value_c: 22.0          # usato con mode: user
  cpu:
    nominal_clock_mhz: null  # null = dai contatori di Windows
    tjmax_c: 100
  gpu:
    thermal_limit_c: 83
  baseline_state: unknown  # clean se il PC è appena stato pulito

realtime:
  debounce_s: 7
  release_s: 15

windows:
  length_min: 5
  warmup_min: 3
  power_cv_max: 0.10
  temp_slope_max: 0.5

regimes:
  mode: fixed              # fixed | adaptive
  fixed_fractions: [0.30, 0.65]

spc:
  phase1_min_obs: 25
  phase1_min_days: 5
  phase1_min_sessions: 5
  rules: [R1, R2, R3]      # carte giornaliere (R4 opzionale)
  window_rules: [R1]       # carte per finestra (autocorrelate)

alerts:
  lookback_days: 14
  action_budget_per_month: 2
  toast: true

game_safe:
  enabled: true
  processes: [easyanticheat.exe, beservice.exe, vgc.exe, faceit.exe]

healthcheck:
  duration_s: 300
  abort_temp_c: 90
